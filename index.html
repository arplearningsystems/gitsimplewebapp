<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A curated collection of the latest published AI updates."
    />
    <title>AI Update Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="eyebrow">Curated AI news</p>
        <h1>AI Update Board</h1>
        <p>
          A collection of recent AI announcements, research, and product updates
          from their original sources.
        </p>
      </header>

      <section class="updates-section" aria-labelledby="updates-title">
        <div class="section-heading">
          <div>
            <h2 id="updates-title">Latest updates</h2>
            <p id="feed-status" class="feed-status" role="status" aria-live="polite">
              Loading updates…
            </p>
          </div>
          <p id="update-count" class="update-count"></p>
        </div>

        <p id="empty-state" class="empty-state" hidden>
          No updates have been published yet. Check back soon.
        </p>
        <ul id="update-list" class="update-list" aria-label="Latest AI updates"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
